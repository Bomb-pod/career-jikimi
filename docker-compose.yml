# career-jikimi 로컬 실행 구성 (FR-9.1 — `docker compose up` 한 번으로 전부 기동)
#
#   cp .env.example .env   → .env에서 JWT_SECRET·OPENAI_API_KEY 채우기
#   docker compose up --build
#   http://localhost:8000
#
# 서비스는 둘뿐이다 (ADR-002). 프론트엔드는 별도 서비스가 아니며 빌드된 정적
# 파일을 app이 서빙한다 (FR-9.5).

services:
  db:
    image: mariadb:11
    # **문자셋을 명시한다** (FR-9.3). 이미지 기본값에 기대지 않는다 —
    # 기본값이 바뀌거나 다른 태그를 쓰면 한글·이모지가 깨지고, 그 사실은
    # 데이터가 이미 망가진 뒤에 드러난다.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?".env에 MARIADB_ROOT_PASSWORD가 필요합니다"}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?".env에 MARIADB_DATABASE가 필요합니다"}
      MARIADB_USER: ${MARIADB_USER:?".env에 MARIADB_USER가 필요합니다"}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?".env에 MARIADB_PASSWORD가 필요합니다"}
    volumes:
      # 명명 볼륨 — 컨테이너를 지워도 데이터가 남는다. 데모 리허설 중에
      # 계정과 대화를 다시 만들지 않아도 된다.
      - db_data:/var/lib/mysql
    healthcheck:
      # app이 이 통과를 기다린다 (아래 depends_on). 그래도 초기화 중일 수 있어
      # 앱 쪽에도 재시도가 있다 (FR-9.2).
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    # **호스트에 포트를 노출하지 않는다** — 이 데모의 유일한 네트워크 보안
    # 조치다 (services.md § db 서비스). DB를 들여다보려면:
    #   docker compose exec db mariadb -u root -p
    #
    # 리소스 제한: 데모 규모라 강제하지 않는다. 필요해지면 여기에 둔다.
    #   deploy:
    #     resources:
    #       limits: { cpus: "1.0", memory: 512M }

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      # 비밀은 이미지에 굽지 않고 런타임에 주입한다 (FR-1.4, NFR-6).
      # 없으면 기동을 멈춘다 — 빈 비밀로 도는 것보다 낫다.
      - path: .env
        required: true
    depends_on:
      db:
        # DB가 healthy가 된 뒤에 기동한다 (FR-9.2).
        condition: service_healthy
    ports:
      - "8000:8000"
    # **15초로 명시하는 이유** — compose 기본값 10초는 열린 WebSocket을 닫고
    # 진행 중 요청을 끝내기에 빡빡하다. uvicorn의
    # `--timeout-graceful-shutdown 10`보다 크게 잡아, SIGKILL이 graceful
    # shutdown을 중간에 끊지 않게 한다 (services.md § Graceful shutdown).
    stop_grace_period: 15s
    restart: unless-stopped
    # 리소스 제한: 위 db와 같은 이유로 주석으로만 남긴다.
    #   deploy:
    #     resources:
    #       limits: { cpus: "2.0", memory: 1G }
    #
    # **replicas를 올리지 않는다** (FR-9.4, CON-1). WebSocket 연결 레지스트리가
    # 프로세스 메모리에 있어, 인스턴스를 늘리면 다른 인스턴스에 붙은 사용자에게
    # 메시지가 가지 않는다. 확장이 필요하면 `core/ws_registry`를 Redis pub/sub으로
    # 먼저 교체해야 한다.

volumes:
  db_data:

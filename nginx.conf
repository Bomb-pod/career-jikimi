# career-jikimi — nginx 리버스 프록시 구성 (프론트/백엔드 컨테이너 분리안)
#
# 이 파일은 `compose.nginx.yml`에서만 쓴다. 기본 구성(`docker-compose.yml`)은
# FastAPI가 정적 파일까지 서빙하므로 nginx가 없다 (FR-9.5, ADR-002).
#
# ## 역할 분담
#
#     브라우저 ──▶ nginx :80 ─┬─ /  그 외        → 정적 파일 (자기가 서빙)
#                             ├─ /auth /rooms … → app:8000 프록시
#                             └─ /ws            → app:8000 프록시 (업그레이드)
#
# **오리진이 하나로 유지되므로 CORS 설정이 필요 없다.** 정적 파일을 별도
# 도메인에 올리는 방식과 갈리는 지점이고, 이 구성을 고른 이유이기도 하다.
# `.env`의 CORS_ORIGINS는 비워둔 채로 둔다 — 채우면 불필요한 헤더만 붙는다.

# 프록시 대상. compose의 서비스 이름 `app`이 그대로 DNS 이름이 된다.
upstream career_jikimi_app {
    server app:8000;
    # 단일 인스턴스다 (CON-1 — ws_registry가 프로세스 메모리에 있어 앱을
    # 늘릴 수 없다). 여기에 server를 더 적으면 WebSocket이 갈라진다.
    keepalive 16;
}

# WebSocket 업그레이드 헤더 중계용.
# `Connection`을 그냥 "upgrade"로 고정하면 일반 HTTP 요청의 keepalive가
# 깨지므로, 업그레이드 요청일 때만 upgrade를 보낸다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 빌드된 SPA가 놓이는 자리. Dockerfile.web이 여기로 복사하고,
    # 개발 시에는 compose가 frontend/dist를 여기에 바인드 마운트한다.
    root /usr/share/nginx/html;
    index index.html;

    # 응답 헤더에서 nginx 버전을 숨긴다. 알려서 득 될 것이 없다.
    server_tokens off;

    # 업로드는 없지만(파일 전송은 범위 밖) 판정 대상 메시지가 길 수 있다.
    client_max_body_size 2m;

    # 한글이 대부분이라 gzip 효과가 크다. 이미지는 이미 압축돼 있어 제외.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # -----------------------------------------------------------------
    # WebSocket — /ws
    # -----------------------------------------------------------------
    # **가장 자주 틀리는 자리다.** 아래 세 줄(http_version, Upgrade, Connection)이
    # 없으면 핸드셰이크가 101로 올라가지 못하고 그냥 400이 떨어진다.
    location = /ws {
        proxy_pass http://career_jikimi_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # **기본값 60초면 유휴 연결이 끊긴다.** 이 앱은 타이핑 인디케이터도
        # 읽음 표시도 없어(범위 밖) 대화가 없으면 프레임이 전혀 오가지 않는다.
        # 점심시간에 방을 열어두면 60초 뒤 조용히 끊기고, 재연결이 붙기
        # 전까지 도착한 메시지를 놓친다.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # 실시간 채널이므로 버퍼링하지 않는다.
        proxy_buffering off;
    }

    # -----------------------------------------------------------------
    # REST API
    # -----------------------------------------------------------------
    # **접두사 목록을 프론트와 맞춰 유지할 것.** 같은 목록이
    # `frontend/vite.config.ts`의 BACKEND_PATHS에도 있다. 새 최상위 라우터가
    # 생기면 두 곳을 같이 고쳐야 한다 — 빠뜨리면 그 요청이 SPA 폴백으로 가서
    # JSON을 기대한 자리에 <!doctype html>이 돌아온다.
    #
    # `/api` 접두사를 만들지 않는 이유는 vite.config.ts에 적힌 것과 같다.
    # components.md가 엔드포인트를 접두사 없이 확정했고, 여기서 새로 만들면
    # 개발과 배포의 경로가 갈라진다.
    location ~ ^/(auth|users|friends|rooms|messages|judgments|health)(/|$) {
        proxy_pass http://career_jikimi_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # NFR-1이 정상 5초 / 타임아웃 4초를 말한다. 판정이 걸린 전송 요청은
        # 앱 안에서 최대 (타임아웃 4초 + 재시도 1회)가 걸릴 수 있으므로
        # 프록시가 그보다 먼저 끊으면 안 된다. 여유를 두어 30초.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # FastAPI 자동 문서. 데모에서는 열어두지만, 외부에 노출한다면
    # 이 블록을 지우거나 접근 제어를 붙일 것.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://career_jikimi_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # -----------------------------------------------------------------
    # 정적 파일
    # -----------------------------------------------------------------
    # Vite가 파일명에 해시를 넣으므로(assets/index-a1b2c3.js) 내용이 바뀌면
    # 이름이 바뀐다. 그래서 영구 캐시가 안전하다.
    #
    # `expires`와 `add_header Cache-Control`을 함께 쓰지 않는다 — 둘 다 쓰면
    # Cache-Control 헤더가 두 줄로 나간다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        # 폴백하지 않는다. 없는 자산에 index.html을 주면 브라우저가 JS를
        # 기대한 자리에서 HTML을 파싱하다 "Unexpected token '<'"로 죽는다.
        try_files $uri =404;
    }

    # **index.html은 절대 캐시하지 않는다.** 이 파일이 캐시되면 새 배포 후에도
    # 브라우저가 옛 해시를 가리키는 옛 index를 계속 읽어 화면이 안 바뀐다.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA 폴백. 이 프로젝트는 react-router를 쓰지 않아(상태 기반 화면 전환)
    # 실제로는 거의 `/`만 요청되지만, 사용자가 임의 경로를 치고 들어와도
    # 404 대신 앱이 뜨도록 남겨둔다. FastAPI의 _mount_spa()가 하던 일이다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 헬스체크용 — nginx 자신이 살아 있는지. app 상태는 /health가 답한다.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# Alembic configuration (ADR-006: the schema is owned by migrations, never create_all()).
#
# Run:  cd backend && alembic upgrade head
# In the container, docker-entrypoint.sh runs it before uvicorn (FR-9.2).
#
# ---------------------------------------------------------------------------
# THIS FILE MUST STAY ASCII-ONLY.
# ---------------------------------------------------------------------------
# Alembic reads alembic.ini with encoding="locale", not UTF-8. On a Windows host
# whose locale codec is cp949/cp1252, any non-ASCII byte here raises
# UnicodeDecodeError before alembic even starts. That failure was observed on a
# Korean Windows host during this stage, so the comments here are English while
# the rest of the project is Korean. Rationale in Korean lives in
# migrations/env.py and migrations/versions/0001_initial_schema.py, which Python
# always reads as UTF-8.

[alembic]
script_location = migrations

# Put backend/ on sys.path so `import app` works from env.py.
prepend_sys_path = .

# Migration filenames look like 0001_initial_schema.py.
# No date prefix: ordering is already decided by the revision chain, and putting
# it in the filename too creates a second source of truth that can disagree.
file_template = %%(rev)s_%%(slug)s

# LEFT EMPTY ON PURPOSE.
# env.py reads the URL from settings.DATABASE_URL (an environment variable).
# Writing it here would hardcode credentials into the repo (FR-1.4, NFR-6).
# Tests override it at runtime with set_main_option("sqlalchemy.url", ...).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
